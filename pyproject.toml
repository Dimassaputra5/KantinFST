[project]
name = "simulasi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhamad Dimas Saputra", email = "dimassaputrq96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
